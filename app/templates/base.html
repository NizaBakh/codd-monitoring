<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <title>{% block title %}{% endblock %}</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">

    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">

    <link rel="stylesheet" href="/static/css/style.css">

</head>

<body>

<div class="layout">

    {% include "sidebar.html" %}

    <div class="main">

        {% include "topbar.html" %}

        <div class="content">

            {% block content %}

            {% endblock %}

        </div>

    </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<!-- Общие -->

<script src="/static/js/helpers.js"></script>

<script src="/static/js/map.js"></script>

<script src="/static/js/districts.js"></script>

<!-- Модули -->

<script src="/static/js/traffic.js"></script>

<script src="/static/js/bus_stops.js"></script>

<script src="/static/js/roads.js"></script>

<script src="/static/js/intersections.js"></script>

<script src="/static/js/pedestrian.js"></script>

<!-- Главный -->

<script src="/static/js/dashboard.js"></script>

{% block scripts %}

{% endblock %}

</body>

</html>
