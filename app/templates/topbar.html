<div class="topbar">

    <div class="topbar-left">

        <div class="system-title">

            <div class="system-name">

                🏙 ЦОДД Monitoring System

            </div>

            <div class="system-subtitle">

                Центр организации дорожного движения города Ташкент

            </div>

        </div>

    </div>


    <div class="topbar-right">

        <div class="weather-box" id="weatherBox">

            <div id="weatherIcon">🌤</div>

            <div class="weather-info">

                <div id="weatherTemp">--°C</div>

                <div id="weatherDesc">Загрузка...</div>

            </div>

        </div>

        <button id="themeToggle" class="theme-button">

            🌙

        </button>

        <div class="clock-box">

            <div id="currentDate"></div>

            <div id="clock"></div>

        </div>

        <div class="user-box">

            <i class="bi bi-person-circle"></i>

            <span>Operator</span>

        </div>

    </div>

</div>

<div class="weather-popup" id="weatherPopup">

    <h5 id="popupCity">📍 Ташкент</h5>

    <div>🌡 Температура: <span id="popupTemp"></span></div>

    <div>🤗 Ощущается: <span id="popupFeels"></span></div>

    <div>💧 Влажность: <span id="popupHumidity"></span></div>

    <div>💨 Ветер: <span id="popupWind"></span></div>

    <div>☁ Облачность: <span id="popupClouds"></span></div>

    <div>🌧 Осадки: <span id="popupRain"></span></div>

    <div>👁 Видимость: <span id="popupVisibility"></span></div>

</div>

<script>

const themeButton = document.getElementById("themeToggle");

function loadTheme(){

    const theme =
        localStorage.getItem("theme") || "dark";


    document.body.classList.toggle(
        "light-theme",
        theme === "light"
    );


    themeButton.innerHTML =
        theme === "light"
            ? "☀️"
            : "🌙";


    /* =================================================
       MAP THEME
    ================================================= */

    if (window.map) {

        if (theme === "light") {

            if (window.map.hasLayer(
                window.darkMapLayer
            )) {

                window.map.removeLayer(
                    window.darkMapLayer
                );

            }

            if (!window.map.hasLayer(
                window.lightMapLayer
            )) {

                window.map.addLayer(
                    window.lightMapLayer
                );

            }

        }

        else {

            if (window.map.hasLayer(
                window.lightMapLayer
            )) {

                window.map.removeLayer(
                    window.lightMapLayer
                );

            }

            if (!window.map.hasLayer(
                window.darkMapLayer
            )) {

                window.map.addLayer(
                    window.darkMapLayer
                );

            }

        }

    }

}

themeButton.onclick = function(){

    const light =
        document.body.classList.toggle("light-theme");


    const theme =
        light ? "light" : "dark";


    localStorage.setItem(
        "theme",
        theme
    );


    themeButton.innerHTML =
        light
            ? "☀️"
            : "🌙";


    /* =================================================
       CHANGE MAP THEME
    ================================================= */

    if (window.map) {

        if (theme === "light") {

            if (window.map.hasLayer(
                window.darkMapLayer
            )) {

                window.map.removeLayer(
                    window.darkMapLayer
                );

            }

            if (!window.map.hasLayer(
                window.lightMapLayer
            )) {

                window.map.addLayer(
                    window.lightMapLayer
                );

            }

        }

        else {

            if (window.map.hasLayer(
                window.lightMapLayer
            )) {

                window.map.removeLayer(
                    window.lightMapLayer
                );

            }

            if (!window.map.hasLayer(
                window.darkMapLayer
            )) {

                window.map.addLayer(
                    window.darkMapLayer
                );

            }

        }

    }

};
loadTheme();

/* =======================
   CLOCK
======================= */

function updateClock(){

    const now = new Date();

    document.getElementById("currentDate").innerHTML =
        "🗓 " +
        now.toLocaleDateString("ru-RU");

    document.getElementById("clock").innerHTML =
        "🕒 " +
        now.toLocaleTimeString("ru-RU");

}

updateClock();

setInterval(updateClock,1000);

</script>
