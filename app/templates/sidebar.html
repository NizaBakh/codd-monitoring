<div class="sidebar">

    <div class="logo">

        <span>ЦОДД</span> Monitoring

    </div>

    <nav class="menu">

        <a href="/">

            <i class="bi bi-speedometer2"></i>

            <span>Дашборд</span>

        </a>

        <!-- ========================================= -->
        <!-- ИНФРАСТРУКТУРА -->
        <!-- ========================================= -->

        <details class="menu-group" id="infraMenu">

            <summary>

                <i class="bi bi-buildings"></i>

                <span>Инфраструктура</span>

            </summary>

            <a href="/traffic-lights">

                <i class="bi bi-stoplights"></i>

                <span>Светофоры</span>

            </a>

            <a href="/roads">

                <i class="bi bi-signpost-2"></i>

                <span>Дороги</span>

            </a>

            <a href="/pedestrian-crossings">

                <i class="bi bi-person-walking"></i>

                <span>Пешеходные переходы</span>

            </a>

            <a href="/intersections">

                <i class="bi bi-diagram-3"></i>

                <span>Перекрёстки</span>

            </a>

        </details>

        <!-- ========================================= -->
        <!-- ТРАНСПОРТ -->
        <!-- ========================================= -->

        <details class="menu-group" id="transportMenu">

            <summary>

                <i class="bi bi-bus-front"></i>

                <span>Транспорт</span>

            </summary>

            <a href="/bus-stops">

                <i class="bi bi-bus-front"></i>

                <span>Остановки</span>

            </a>

            <a href="/metro">

                <i class="bi bi-train-front"></i>

                <span>Метрополитен</span>

            </a>

        </details>

    </nav>

</div>

<script>

document.addEventListener("DOMContentLoaded", function () {

    const infra = document.getElementById("infraMenu");

    const transport = document.getElementById("transportMenu");

    if (localStorage.getItem("infraMenu") === "true") {

        infra.open = true;

    }

    if (localStorage.getItem("transportMenu") === "true") {

        transport.open = true;

    }

    infra.addEventListener("toggle", function () {

        localStorage.setItem(

            "infraMenu",

            infra.open

        );

    });

    transport.addEventListener("toggle", function () {

        localStorage.setItem(

            "transportMenu",

            transport.open

        );

    });

    const path = window.location.pathname;

    if (

        path.startsWith("/traffic-lights") ||

        path.startsWith("/roads") ||

        path.startsWith("/pedestrian-crossings") ||

        path.startsWith("/intersections")

    ) {

        infra.open = true;

        localStorage.setItem("infraMenu", true);

    }

    if (

        path.startsWith("/bus-stops") ||

        path.startsWith("/metro")

    ) {

        transport.open = true;

        localStorage.setItem("transportMenu", true);

    }

});

</script>
